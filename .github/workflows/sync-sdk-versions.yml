name: Sync SDK versions in docs

# Polls the latest released tag on Vouchflow/android-sdk and Vouchflow/ios-sdk
# daily and opens a PR if any docs file references an older version.
#
# Why scheduled rather than triggered by SDK releases:
# - Cross-repo workflow_dispatch needs a PAT with repo:write on this repo,
#   which we'd have to mint and store in two other repos. A daily poll is
#   one secret in one place and bounded staleness is fine for docs.
# - Also lets us catch out-of-band releases (e.g. patches published from a
#   maintainer's laptop) without needing the SDK CI to know about us.

on:
  schedule:
    - cron: '0 14 * * *'   # 14:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve latest SDK release tags
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          android=$(gh release list --repo Vouchflow/android-sdk --limit 1 --json tagName --jq '.[0].tagName' | sed 's/^v//')
          ios=$(    gh release list --repo Vouchflow/ios-sdk     --limit 1 --json tagName --jq '.[0].tagName' | sed 's/^v//')
          if [ -z "$android" ] || [ -z "$ios" ]; then
            echo "Failed to resolve SDK tags (android=$android, ios=$ios)" >&2
            exit 1
          fi
          echo "android=$android" >> "$GITHUB_OUTPUT"
          echo "ios=$ios"         >> "$GITHUB_OUTPUT"

      - name: Patch version refs in HTML
        id: patch
        env:
          ANDROID: ${{ steps.latest.outputs.android }}
          IOS:     ${{ steps.latest.outputs.ios }}
        run: |
          # Android: dev.vouchflow:android-sdk:X.Y.Z
          find public -name '*.html' -print0 | xargs -0 sed -i -E \
            "s|(dev\.vouchflow:android-sdk:)[0-9]+\.[0-9]+\.[0-9]+|\1${ANDROID}|g"

          # iOS: SwiftPM `from: "X.Y.Z"` lines (also catches the `// use latest`
          # comment line). Anchored to a Vouchflow ios-sdk URL on a nearby line
          # would be safer but every from: in our docs refers to the SDK, so a
          # plain match is fine for now.
          find public -name '*.html' -print0 | xargs -0 sed -i -E \
            "s|(<span class=\"n\">from</span><span class=\"t\">: </span><span class=\"s\">\")[0-9]+\.[0-9]+\.[0-9]+(\")|\1${IOS}\2|g"

          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true"  >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR
        if: steps.patch.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANDROID:  ${{ steps.latest.outputs.android }}
          IOS:      ${{ steps.latest.outputs.ios }}
        run: |
          branch="docs/sync-sdk-${ANDROID}-${IOS}"
          # If a PR for these exact versions already exists, skip silently.
          if gh pr list --head "$branch" --json number --jq 'length' | grep -qx 1; then
            echo "PR already open for android=$ANDROID ios=$IOS"
            exit 0
          fi

          git config user.name  "vouchflow-bot"
          git config user.email "noreply@vouchflow.dev"
          git checkout -b "$branch"
          git add -A
          git commit -m "docs: bump SDK refs to android-sdk@${ANDROID}, ios-sdk@${IOS}"
          git push origin "$branch"

          gh pr create \
            --title "docs: bump SDK refs to android-sdk@${ANDROID}, ios-sdk@${IOS}" \
            --body  "Automated bump from the daily sync-sdk-versions workflow. Android SDK is now ${ANDROID}; iOS SDK is now ${IOS}." \
            --base  main \
            --head  "$branch"
